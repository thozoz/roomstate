; ESP32-C3 Super Mini — battery-powered temperature/humidity monitor
; Chip verified: ESP32-C3 (QFN32) rev v0.4, native USB-Serial/JTAG, 4MB embedded flash, port COM6

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1   ; closest generic ESP32-C3 definition, no dedicated board file for this breakout
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

; Super Mini uses native USB (NO USB-UART bridge chip). Without these flags,
; the Serial object routes to physical UART0 pins (GPIO20/21) rather than the USB port -
; meaning Serial.print never reaches the computer. ARDUINO_USB_MODE=1: ESP32-C3
; lacks full USB-OTG and only has USB-Serial/JTAG, which is the correct mode.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.10

; Super Mini clones may lack automatic reset circuitry.
; If initial upload fails: press & hold BOOT + press RESET,
; release RESET, release BOOT, then re-run upload (manual download mode).
